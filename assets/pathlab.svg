<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .card-bg { fill: #080415; stroke: #1d1238; stroke-width: 1.5; }
      .meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #64748b; letter-spacing: 2px; }
      .meta-right { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #a855f7; font-weight: 700; letter-spacing: 1px; }
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: 4px; }
      
      /* Abstract Graphic Vectors */
      .graph-line { stroke: #2c1a4d; stroke-width: 1; }
      .graph-path { stroke: #00f7ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: url(#glow); }
      .graph-node { fill: #080415; stroke: #a855f7; stroke-width: 1.5; }
      .graph-node-active { fill: #00f7ff; stroke: #ffffff; stroke-width: 1.5; filter: url(#glow-node); }

      @keyframes floatPath {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .anim-group {
        animation: floatPath 5s ease-in-out infinite;
      }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-node" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Border Card Frame -->
  <rect width="400" height="250" rx="12" class="card-bg"/>

  <!-- Top Metadata Header -->
  <g transform="translate(25, 30)">
    <text x="0" y="0" class="meta">SELECTED WORK // 01</text>
    <text x="350" y="0" class="meta-right" text-anchor="end">SYS.PATHLAB</text>
    <line x1="0" y1="10" x2="350" y2="10" stroke="#1d1238" stroke-width="1"/>
  </g>

  <!-- Middle Graphic (Dijkstra Pathfinder abstraction) -->
  <g class="anim-group" transform="translate(200, 110)">
    <!-- Radar concentric bounds -->
    <circle cx="0" cy="0" r="50" stroke="#130d2d" stroke-width="0.5" stroke-dasharray="2,3" />
    <circle cx="0" cy="0" r="30" stroke="#130d2d" stroke-width="0.5" />
    
    <!-- Base Graph Lines -->
    <line x1="-120" y1="30" x2="-60" y2="-20" class="graph-line"/>
    <line x1="-120" y1="30" x2="-20" y2="40" class="graph-line"/>
    <line x1="-60" y1="-20" x2="20" y2="-45" class="graph-line"/>
    <line x1="-20" y1="40" x2="40" y2="30" class="graph-line"/>
    <line x1="20" y1="-45" x2="100" y2="-20" class="graph-line"/>
    <line x1="40" y1="30" x2="100" y2="-20" class="graph-line"/>
    <line x1="-60" y1="-20" x2="40" y2="30" class="graph-line"/>
    
    <!-- Highlighted Active Optimal Path -->
    <path d="M -120,30 L -60,-20 L 40,30 L 100,-20" fill="none" class="graph-path"/>
    
    <!-- Nodes -->
    <circle cx="-120" cy="30" r="3.5" class="graph-node-active"/>
    <circle cx="-60" cy="-20" r="3.5" class="graph-node-active"/>
    <circle cx="-20" cy="40" r="3" class="graph-node"/>
    <circle cx="20" cy="-45" r="3" class="graph-node"/>
    <circle cx="40" cy="30" r="3.5" class="graph-node-active"/>
    <circle cx="100" cy="-20" r="4.5" class="graph-node-active"/>
  </g>

  <!-- Bottom Details Board -->
  <g transform="translate(25, 205)">
    <line x1="0" y1="-10" x2="350" y2="-10" stroke="#1d1238" stroke-width="1"/>
    <text x="0" y="10" class="title">PATHLAB</text>
    <text x="350" y="8" class="meta" text-anchor="end" fill="#00f7ff">DIJKSTRA &bull; A* &bull; OSM API &bull; TS</text>
  </g>
</svg>
