<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;display=swap');
      .grid-line { stroke: #2a2050; stroke-width: 0.5; opacity: 0.3; }
      .path-line { stroke: #eab308; stroke-dasharray: 600; stroke-dashoffset: 0; animation: trace 3s linear infinite; filter: url(#glow-yellow); }
      .search-front { fill: rgba(168, 85, 247, 0.15); stroke: #a855f7; stroke-width: 1; stroke-dasharray: 4,4; }
      .node-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #64748b; font-weight: 700; }
      @keyframes trace {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Border Frame -->
  <rect width="400" height="250" rx="12" fill="#090515" stroke="#1f183c" stroke-width="1.5"/>

  <!-- Faint Math Grid -->
  <g>
    <path d="M 0,25 h 400 M 0,50 h 400 M 0,75 h 400 M 0,100 h 400 M 0,125 h 400 M 0,150 h 400 M 0,175 h 400 M 0,200 h 400 M 0,225 h 400" class="grid-line"/>
    <path d="M 40,0 v 250 M 80,0 v 250 M 120,0 v 250 M 160,0 v 250 M 200,0 v 250 M 240,0 v 250 M 280,0 v 250 M 320,0 v 250 M 360,0 v 250" class="grid-line"/>
  </g>

  <!-- Obstacle Blockades -->
  <rect x="160" y="50" width="40" height="100" rx="4" fill="#1b0e35" stroke="#7e22ce" stroke-width="1" opacity="0.6"/>
  <rect x="240" y="100" width="40" height="100" rx="4" fill="#1b0e35" stroke="#7e22ce" stroke-width="1" opacity="0.6"/>

  <!-- Search Waves (Explored Frontiers) -->
  <circle cx="60" cy="75" r="45" class="search-front" />
  <circle cx="60" cy="75" r="85" class="search-front" />
  <circle cx="60" cy="75" r="130" class="search-front" opacity="0.5"/>

  <!-- Shortest Path Vector -->
  <path d="M 60,75 L 120,75 L 140,175 L 220,175 L 220,75 L 340,75" class="path-line" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Start Node -->
  <circle cx="60" cy="75" r="10" fill="#059669" opacity="0.3"/>
  <circle cx="60" cy="75" r="5" fill="#10b981"/>
  <text x="45" y="60" class="node-text" fill="#10b981">Start (S)</text>

  <!-- Target Node -->
  <circle cx="340" cy="75" r="10" fill="#dc2626" opacity="0.3"/>
  <circle cx="340" cy="75" r="5" fill="#ef4444"/>
  <text x="320" y="60" class="node-text" fill="#ef4444">Target (T)</text>

  <!-- Node Coordinates / Decors -->
  <circle cx="120" cy="75" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="140" cy="175" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="220" cy="175" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="220" cy="75" r="3" fill="#ffffff" opacity="0.7"/>

  <text x="15" y="235" class="node-text" fill="#475569">> ALGORITHM: DIJKSTRA / A* RESOLVED</text>
  <text x="300" y="235" class="node-text" fill="#eab308" font-size="10">COST: 480m</text>
</svg>
