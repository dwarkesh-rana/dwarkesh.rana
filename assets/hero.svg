<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;800&amp;family=JetBrains+Mono:wght@300;500;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 64px;
        fill: #ffffff;
        letter-spacing: 12px;
      }
      
      .brand-title-glow {
        filter: url(#blur-gate);
        opacity: 0.4;
      }
      
      .meta-label {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
        letter-spacing: 2px;
      }
      
      .text-body {
        font-family: 'Outfit', sans-serif;
        font-weight: 200;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 1px;
      }

      .text-highlight {
        font-weight: 400;
        fill: #00f7ff;
      }

      @keyframes floatArt {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(1deg); }
      }
      
      .art-group {
        animation: floatArt 6s ease-in-out infinite;
      }
      
      .art-line {
        stroke: #a855f7;
        stroke-width: 0.75;
        opacity: 0.3;
      }
      
      .art-line-active {
        stroke: #00f7ff;
        stroke-width: 1.5;
        opacity: 0.85;
        filter: url(#glow-cyan);
      }
      
      .art-node {
        fill: #090515;
        stroke: #a855f7;
        stroke-width: 1.5;
      }
      
      .art-node-active {
        fill: #00f7ff;
        stroke: #ffffff;
        stroke-width: 2;
        filter: url(#glow-cyan-node);
      }
    </style>
    
    <filter id="blur-gate" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan-node" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Luxury Background Canvas -->
  <rect width="800" height="380" rx="16" fill="#090514" stroke="#1f153a" stroke-width="2"/>

  <!-- Left Side Interface Grid Details -->
  <g transform="translate(45, 60)">
    <!-- Metadata Identifiers -->
    <text x="0" y="0" class="meta-label">SYS.DWARKESH // ACTIVE_PORT</text>
    
    <!-- Title and glowing base -->
    <text x="-2" y="70" class="brand-title brand-title-glow" fill="#00f7ff">DWARKESH</text>
    <text x="0" y="70" class="brand-title">DWARKESH</text>
    
    <!-- Role details -->
    <text x="3" y="115" class="meta-label" fill="#a855f7">IT ENGINEER &bull; BUILDER &bull; EXPERIMENTER</text>
    
    <!-- Vision statement -->
    <text x="3" y="180" class="text-body">
      Building <tspan class="text-highlight">algorithms</tspan>, 
      <tspan class="text-highlight">AI networks</tspan> &amp; 
      <tspan class="text-highlight">digital interfaces</tspan>
    </text>
    <text x="3" y="210" class="text-body" font-size="15" fill="#64748b">
      Creating tools that test boundaries and solve real-world problems.
    </text>
    
    <!-- Status parameters -->
    <g transform="translate(3, 255)">
      <rect width="180" height="24" rx="4" fill="#130d2d" stroke="#2c1a4d" stroke-width="1"/>
      <circle cx="15" cy="12" r="4" fill="#00f7ff" filter="url(#glow-cyan-node)"/>
      <text x="28" y="16" class="meta-label" fill="#00f7ff">CURRENT STATE: BUILDING</text>
    </g>
  </g>

  <!-- Right Side Interactive Art Piece (Abstract Computational Network) -->
  <g class="art-group" transform="translate(540, 190)">
    <!-- Tech Rings -->
    <circle cx="0" cy="0" r="140" stroke="#1c143c" stroke-width="1" stroke-dasharray="4,6" fill="none"/>
    <circle cx="0" cy="0" r="90" stroke="#251242" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="0" r="40" stroke="#00f7ff" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.4" fill="none"/>
    
    <!-- Connection Paths -->
    <!-- Dijkstra optimal resolve path -->
    <path d="M -110,-40 H -60 L -10,40 L 60,-30 L 110,-30" class="art-line-active" fill="none"/>
    
    <!-- Surrounding structural lines -->
    <path d="M -110,-40 L -90,60 L -10,40 L 70,80 L 110,-30" class="art-line" fill="none"/>
    <path d="M -60,-80 L -10,40 L 40,-90 L 60,-30 L 10,120" class="art-line" fill="none"/>
    <path d="M -90,60 L 10,120 L 70,80" class="art-line" fill="none"/>
    <path d="M -60,-80 L 60,-30" class="art-line" fill="none"/>
    
    <!-- Graph Nodes -->
    <circle cx="-110" cy="-40" r="4" class="art-node-active"/>
    <circle cx="-60" cy="-80" r="4" class="art-node"/>
    <circle cx="-60" cy="75" r="4.5" class="art-node"/>
    <circle cx="-90" cy="60" r="3.5" class="art-node"/>
    <circle cx="-10" cy="40" r="4.5" class="art-node-active"/>
    <circle cx="40" cy="-90" r="3.5" class="art-node"/>
    <circle cx="60" cy="-30" r="4" class="art-node-active"/>
    <circle cx="70" cy="80" r="4.5" class="art-node"/>
    <circle cx="10" cy="120" r="4.5" class="art-node"/>
    <circle cx="110" cy="-30" r="5" class="art-node-active"/>

    <!-- Concentric glow overlays on active node endpoints -->
    <circle cx="110" cy="-30" r="10" stroke="#00f7ff" stroke-width="0.5" fill="none" opacity="0.5"/>
  </g>
</svg>
