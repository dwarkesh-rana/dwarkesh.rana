<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .card-bg { fill: #080415; stroke: #1d1238; stroke-width: 1.5; }
      .meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #64748b; letter-spacing: 2px; }
      .meta-right { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #a855f7; font-weight: 700; letter-spacing: 1px; }
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: 4px; }
      
      /* Nova Specific Companion Vectors */
      .companion-shape { stroke: #a855f7; stroke-width: 1.5; fill: none; }
      .companion-core { fill: #00f7ff; filter: url(#glow-nova); }
      .orbital-ring { stroke: #251242; stroke-width: 0.75; }

      @keyframes floatPet {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .pet-group {
        animation: floatPet 4s ease-in-out infinite;
      }
    </style>
    <filter id="glow-nova" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Border Card Frame -->
  <rect width="400" height="250" rx="12" class="card-bg"/>

  <!-- Top Metadata Header -->
  <g transform="translate(25, 30)">
    <text x="0" y="0" class="meta">SELECTED WORK // 04</text>
    <text x="350" y="0" class="meta-right" text-anchor="end">SYS.NOVA</text>
    <line x1="0" y1="10" x2="350" y2="10" stroke="#1d1238" stroke-width="1"/>
  </g>

  <!-- Middle Graphic (Sleek abstract computer companion vector) -->
  <g class="pet-group" transform="translate(200, 115)">
    <!-- Radial orbital tracks -->
    <ellipse cx="0" cy="0" rx="90" ry="25" class="orbital-ring" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="75" ry="15" class="orbital-ring" transform="rotate(15)"/>
    <circle cx="0" cy="0" r="45" stroke="#180f35" stroke-dasharray="2,3" stroke-width="0.5"/>
    
    <!-- Abstract Cat Face Outline -->
    <!-- Ears -->
    <polygon points="-25,-25 -15,-45 -5,-25" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <polygon points="5,-25 15,-45 25,-25" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    
    <!-- Outer Head -->
    <rect x="-30" y="-25" width="60" height="45" rx="15" class="companion-shape" stroke-width="1.5"/>
    
    <!-- Glowing core eyes -->
    <circle cx="-12" cy="-4" r="3" class="companion-core"/>
    <circle cx="12" cy="-4" r="3" class="companion-core"/>
    
    <!-- Cheerful whisker vectors -->
    <line x1="-35" y1="4" x2="-45" y2="3" stroke="#00f7ff" stroke-width="1" opacity="0.5"/>
    <line x1="-35" y1="10" x2="-47" y2="12" stroke="#00f7ff" stroke-width="1" opacity="0.5"/>
    <line x1="35" y1="4" x2="45" y2="3" stroke="#00f7ff" stroke-width="1" opacity="0.5"/>
    <line x1="35" y1="10" x2="47" y2="12" stroke="#00f7ff" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Bottom Details Board -->
  <g transform="translate(25, 205)">
    <line x1="0" y1="-10" x2="350" y2="-10" stroke="#1d1238" stroke-width="1"/>
    <text x="0" y="10" class="title">NOVA ENGINE</text>
    <text x="350" y="8" class="meta" text-anchor="end" fill="#00f7ff">TAURI &bull; RUST &bull; TS &bull; CANVAS &bull; SQLITE</text>
  </g>
</svg>
