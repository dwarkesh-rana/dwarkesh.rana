<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&amp;display=swap');
      .spendly-txt { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; fill: #64748b; }
      .spendly-bold { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 20px; fill: #ffffff; }
      
      @keyframes dash {
        0% { stroke-dashoffset: 280; }
        100% { stroke-dashoffset: 92; }
      }
      .gauge-active {
        stroke-dasharray: 280;
        stroke-dashoffset: 92; 
        animation: dash 2s ease-out;
        filter: url(#glow-neon);
      }
    </style>
    <filter id="glow-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Border Frame -->
  <rect width="400" height="250" rx="12" fill="#090515" stroke="#1f183c" stroke-width="1.5"/>

  <!-- Radial Glow Backdrop -->
  <circle cx="150" cy="120" r="45" fill="#132c32" opacity="0.2" filter="url(#glow-neon)" />

  <!-- Outer Track Base Gauge -->
  <circle cx="150" cy="120" r="45" stroke="#251242" stroke-width="8" />

  <!-- Active Outer Gauge (representing 33%) -->
  <circle cx="150" cy="120" r="45" stroke="#00f7ff" stroke-width="8" stroke-linecap="round" class="gauge-active" transform="rotate(-90 150 120)"/>

  <!-- Center Text -->
  <text x="150" y="122" class="spendly-bold" text-anchor="middle">33%</text>
  <text x="150" y="137" class="spendly-txt" text-anchor="middle" font-size="9" fill="#00f7ff">USD LOGGED</text>

  <!-- Expense Categories List on the Right -->
  <g transform="translate(235, 75)">
    <!-- Category 1 -->
    <rect width="130" height="22" rx="4" fill="#160e35" stroke="#1e1837" stroke-width="1"/>
    <circle cx="12" cy="11" r="4" fill="#00f7ff"/>
    <text x="25" y="15" class="spendly-txt" font-size="9" fill="#94a3b8">Sushi / Food</text>
    <text x="122" y="15" class="spendly-txt" font-size="9" text-anchor="end" fill="#00f7ff">$18.50</text>
    
    <!-- Category 2 -->
    <rect width="130" height="22" rx="4" fill="#160e35" stroke="#1e1837" stroke-width="1" transform="translate(0, 30)"/>
    <circle cx="12" cy="41" r="4" fill="#a855f7"/>
    <text x="25" y="45" class="spendly-txt" font-size="9" fill="#94a3b8">Starbucks / Caffeine</text>
    <text x="122" y="45" class="spendly-txt" font-size="9" text-anchor="end" fill="#a855f7">$14.50</text>

    <!-- Category 3 -->
    <rect width="130" height="22" rx="4" fill="#110b25" stroke="#1e1837" stroke-width="1" transform="translate(0, 60)" opacity="0.6"/>
    <circle cx="12" cy="71" r="4" fill="#64748b"/>
    <text x="25" y="75" class="spendly-txt" font-size="9" fill="#475569">Other / Uncategorized</text>
    <text x="122" y="75" class="spendly-txt" font-size="9" text-anchor="end" fill="#475569">$0.00</text>
  </g>

  <text x="15" y="235" class="spendly-txt">> LEDGER: EXPENSE GRAPH INDEXED</text>
  <text x="345" y="235" class="spendly-txt" fill="#00f7ff">EXP: 03</text>
</svg>
