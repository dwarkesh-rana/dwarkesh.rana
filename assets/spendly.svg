<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .card-bg { fill: #080415; stroke: #1d1238; stroke-width: 1.5; }
      .meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #64748b; letter-spacing: 2px; }
      .meta-right { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #a855f7; font-weight: 700; letter-spacing: 1px; }
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: 4px; }
      
      /* Spendly Specific Vectors */
      .curve-base { stroke: #251242; stroke-width: 1.5; stroke-dasharray: 3,3; }
      .curve-line { stroke: #00f7ff; stroke-width: 2.5; stroke-linecap: round; filter: url(#glow-spend); }
      .chart-node { fill: #00f7ff; stroke: #ffffff; stroke-width: 1.5; filter: url(#glow-node); }

      @keyframes floatChart {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .chart-group {
        animation: floatChart 4.5s ease-in-out infinite;
      }
    </style>
    <filter id="glow-spend" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-node" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Border Card Frame -->
  <rect width="400" height="250" rx="12" class="card-bg"/>

  <!-- Top Metadata Header -->
  <g transform="translate(25, 30)">
    <text x="0" y="0" class="meta">SELECTED WORK // 03</text>
    <text x="350" y="0" class="meta-right" text-anchor="end">SYS.SPENDLY</text>
    <line x1="0" y1="10" x2="350" y2="10" stroke="#1d1238" stroke-width="1"/>
  </g>

  <!-- Middle Graphic (Sleek transaction/finance curve telemetry) -->
  <g class="chart-group" transform="translate(60, 120)">
    <!-- Faint coordinate axes -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#1c113b" stroke-width="1"/>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#1c113b" stroke-width="1"/>
    <line x1="0" y1="-50" x2="280" y2="-50" stroke="#1c113b" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Base Dotted Curve -->
    <path d="M 0,35 Q 70,-30 140,-10 T 280,-40" fill="none" class="curve-base"/>
    
    <!-- Highlighted Active Curve -->
    <path d="M 0,35 Q 70,-30 140,-10" fill="none" class="curve-line"/>
    
    <!-- Active coordinates intersection node -->
    <circle cx="140" cy="-10" r="4.5" class="chart-node"/>
    
    <!-- Vertical coordinate projection line -->
    <line x1="140" y1="-10" x2="140" y2="50" stroke="#00f7ff" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.8"/>
    <line x1="0" y1="-10" x2="140" y2="-10" stroke="#00f7ff" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.8"/>
    
    <!-- Legend text -->
    <text x="148" y="-14" font-family="'JetBrains Mono'" font-size="8" fill="#00f7ff" font-weight="700">VAL: +33.00%</text>
  </g>

  <!-- Bottom Details Board -->
  <g transform="translate(25, 205)">
    <line x1="0" y1="-10" x2="350" y2="-10" stroke="#1d1238" stroke-width="1"/>
    <text x="0" y="10" class="title">SPENDLY</text>
    <text x="350" y="8" class="meta" text-anchor="end" fill="#00f7ff">REACT NATIVE &bull; GEMINI PRO &bull; SQLITE</text>
  </g>
</svg>
