<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .card-bg { fill: #080415; stroke: #1d1238; stroke-width: 1.5; }
      .meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #64748b; letter-spacing: 2px; }
      .meta-right { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #a855f7; font-weight: 700; letter-spacing: 1px; }
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: 4px; }
      
      /* Nexa Specific Vectors */
      .feed-item-bg { fill: #110826; stroke: #3b0764; stroke-width: 1; }
      .sparkle { fill: #00f7ff; filter: url(#glow-nexa); }
      
      @keyframes cardsSlide {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.02); }
      }
      .stack-group {
        animation: cardsSlide 6s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
    <filter id="glow-nexa" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Border Card Frame -->
  <rect width="400" height="250" rx="12" class="card-bg"/>

  <!-- Top Metadata Header -->
  <g transform="translate(25, 30)">
    <text x="0" y="0" class="meta">SELECTED WORK // 02</text>
    <text x="350" y="0" class="meta-right" text-anchor="end">SYS.NEXA</text>
    <line x1="0" y1="10" x2="350" y2="10" stroke="#1d1238" stroke-width="1"/>
  </g>

  <!-- Middle Graphic (Card feed stack interface) -->
  <g class="stack-group" transform="translate(200, 115)">
    <!-- Rear cards -->
    <rect x="-40" y="-30" width="80" height="75" rx="6" fill="#0d041f" stroke="#1c1139" stroke-width="1" opacity="0.6" transform="rotate(-6)"/>
    <rect x="-40" y="-30" width="80" height="75" rx="6" fill="#0e0622" stroke="#251242" stroke-width="1" opacity="0.8" transform="rotate(4)"/>
    
    <!-- Top Primary Card -->
    <g transform="translate(0, 0)">
      <rect x="-40" y="-35" width="80" height="75" rx="6" fill="#130a2f" stroke="#a855f7" stroke-width="1.25"/>
      <line x1="-30" y1="-20" x2="-10" y2="-20" stroke="#00f7ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="-8" x2="15" y2="-8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="2" x2="5" y2="2" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Sparkle/Gemini AI logo representation -->
      <path d="M 12,16 Q 17,16 17,11 Q 17,16 22,16 Q 17,16 17,21 Q 17,16 12,16 Z" class="sparkle"/>
    </g>

    <!-- Up/Down active telemetry lines -->
    <path d="M -90,-20 L -80,-30 L -70,-20" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M -90,15 L -80,25 L -70,15" stroke="#00f7ff" stroke-width="1.5" stroke-linecap="round" fill="none" class="sparkle"/>
    
    <path d="M 70,-20 L 80,-30 L 90,-20" stroke="#00f7ff" stroke-width="1.5" stroke-linecap="round" fill="none" class="sparkle"/>
    <path d="M 70,15 L 80,25 L 90,15" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Bottom Details Board -->
  <g transform="translate(25, 205)">
    <line x1="0" y1="-10" x2="350" y2="-10" stroke="#1d1238" stroke-width="1"/>
    <text x="0" y="10" class="title">NEXA</text>
    <text x="350" y="8" class="meta" text-anchor="end" fill="#00f7ff">RN &bull; EXPO &bull; GEMINI &bull; SUPABASE</text>
  </g>
</svg>
